<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Perfil - Tracker Finanzas</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen">

    <!-- Menú de Navegación Compartido -->
    <nav class="bg-white shadow-sm px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <span id="nav-avatar" class="text-2xl">👨‍💻</span>
            <h1 class="font-bold text-lg text-indigo-600">Hola, <span id="nav-name">Usuario</span></h1>
        </div>
        <div class="flex gap-4 items-center text-sm font-semibold">
            <a href="dashboard.html" class="text-gray-600 hover:text-indigo-600">Budget</a>
            <a href="adicionales.html" class="text-gray-600 hover:text-indigo-600">Gastos Adicionales</a>
            <a href="perfil.html" class="text-indigo-600 border-b-2 border-indigo-600 pb-1">Mi Perfil</a>
            <button id="btn-logout" class="bg-red-50 text-red-600 px-3 py-1.5 rounded-lg hover:bg-red-100 transition">Salir</button>
        </div>
    </nav>

    <main class="max-w-xl mx-auto p-6 space-y-6">
        <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
            <h2 class="text-xl font-bold text-gray-800 mb-6">Ajustes de Perfil</h2>
            
            <form id="profile-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1">Nombre Completo</label>
                    <input type="text" id="p-name" class="w-full p-3 border rounded-xl outline-none" required>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1">Nombre de Usuario</label>
                    <input type="text" id="p-user" class="w-full p-3 border rounded-xl outline-none" required>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1">Elige tu Avatar</label>
                    <div class="flex gap-4">
                        <label class="cursor-pointer p-2 border rounded-xl"><input type="radio" name="avatar" value="👨‍💻"> 👨‍💻</label>
                        <label class="cursor-pointer p-2 border rounded-xl"><input type="radio" name="avatar" value="👩‍💼"> 👩‍💼</label>
                        <label class="cursor-pointer p-2 border rounded-xl"><input type="radio" name="avatar" value="🚀"> 🚀</label>
                        <label class="cursor-pointer p-2 border rounded-xl"><input type="radio" name="avatar" value="💰"> 💰</label>
                    </div>
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl hover:bg-indigo-700 transition">Guardar Cambios</button>
            </form>

            <hr class="my-6">

            <div class="space-y-3">
                <h3 class="font-bold text-gray-800">Seguridad</h3>
                <button id="btn-reset-pass" class="w-full bg-slate-100 text-slate-700 font-semibold py-2.5 rounded-xl hover:bg-slate-200 transition text-sm">Enviar correo para cambiar contraseña</button>
            </div>
        </div>
    </main>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { onAuthStateChanged, signOut, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        let currentUser = null;

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = "index.html"; return; }
            currentUser = user;
            
            const userSnap = await getDoc(doc(db, "users", user.uid));
            if (userSnap.exists()) {
                const data = userSnap.data();
                document.getElementById('nav-name').textContent = data.name || "Usuario";
                document.getElementById('nav-avatar').textContent = data.avatar || "👨‍💻";
                document.getElementById('p-name').value = data.name || "";
                document.getElementById('p-user').value = data.user || "";
                
                const avatarRadio = document.querySelector(`input[name="avatar"][value="${data.avatar}"]`);
                if (avatarRadio) avatarRadio.checked = true;
            }
        });

        document.getElementById('btn-logout').onclick = () => signOut(auth).then(() => window.location.href = "index.html");

        document.getElementById('profile-form').onsubmit = async (e) => {
            e.preventDefault();
            const name = document.getElementById('p-name').value;
            const userVal = document.getElementById('p-user').value;
            const avatar = document.querySelector('input[name="avatar"]:checked')?.value || "👨‍💻";

            await updateDoc(doc(db, "users", currentUser.uid), { name, user: userVal, avatar });
            alert("Perfil actualizado correctamente.");
            location.reload();
        };

        document.getElementById('btn-reset-pass').onclick = async () => {
            try {
                await sendPasswordResetEmail(auth, currentUser.email);
                alert("Te hemos enviado un correo para restablecer tu contraseña.");
            } catch (err) {
                alert("Error: " + err.message);
            }
        };
    </script>
</body>
</html>
