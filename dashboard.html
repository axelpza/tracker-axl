<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Tracker Finanzas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen pb-12 relative overflow-x-hidden">

    <div class="relative z-10">
        <!-- Menú de Navegación -->
        <nav class="theme-nav backdrop-blur-md shadow-sm px-4 sm:px-6 py-4 flex flex-col sm:flex-row justify-between items-center gap-3">
            <div class="flex items-center gap-3">
                <span id="nav-avatar" class="text-2xl">👨‍💻</span>
                <h1 class="font-bold text-lg text-indigo-400">Hola, <span id="nav-name">Usuario</span></h1>
            </div>
            <div class="flex flex-wrap justify-center gap-3 sm:gap-4 items-center text-sm font-semibold">
                <a href="dashboard.html" class="text-indigo-400 border-b-2 border-indigo-400 pb-1">Budget</a>
                <a href="gastos.html" class="text-slate-400 hover:text-indigo-400">Gastos</a>
                <a href="adicionales.html" class="text-slate-400 hover:text-indigo-400">Gastos Adicionales</a>
                <a href="perfil.html" class="text-slate-400 hover:text-indigo-400">Mi Perfil</a>
                <button id="btn-logout" class="bg-red-500/10 text-red-400 px-3 py-1.5 rounded-lg hover:bg-red-500/20 transition">Salir</button>
            </div>
        </nav>

        <main class="max-w-6xl mx-auto p-4 sm:p-6 space-y-6">
            <!-- Selector de Meses -->
            <div class="flex gap-2 overflow-x-auto pb-2" id="month-tabs"></div>

            <!-- Filtros Dashboard -->
            <div class="theme-card p-4 rounded-2xl border flex flex-wrap justify-between items-center gap-2">
                <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Filtrar Dashboard:</span>
                <div class="flex gap-2">
                    <button id="btn-dash-q1" class="px-4 py-2 rounded-xl text-xs font-bold theme-card">1ra Quincena</button>
                    <button id="btn-dash-q2" class="px-4 py-2 rounded-xl text-xs font-bold theme-card">2da Quincena</button>
                    <button id="btn-dash-mes" class="px-4 py-2 rounded-xl text-xs font-bold bg-indigo-600 text-white">Mes Completo</button>
                </div>
            </div>
            
            <!-- Resto del contenido del Dashboard -->
        </main>
    </div>

    <!-- Módulos JavaScript Externos -->
    <script type="module" src="js/theme.js"></script>
    <script type="module" src="js/background.js"></script>
</body>
</html>
