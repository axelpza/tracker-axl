<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Tracker Finanzas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-100 min-h-screen">

    <!-- Menú de Navegación Compartido -->
    <nav class="bg-white shadow-sm px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <span id="nav-avatar" class="text-2xl">👨‍💻</span>
            <h1 class="font-bold text-lg text-indigo-600">Hola, <span id="nav-name">Usuario</span></h1>
        </div>
        <div class="flex gap-4 items-center text-sm font-semibold">
            <a href="dashboard.html" class="text-indigo-600 border-b-2 border-indigo-600 pb-1">Budget</a>
            <a href="adicionales.html" class="text-gray-600 hover:text-indigo-600">Gastos Adicionales</a>
            <a href="perfil.html" class="text-gray-600 hover:text-indigo-600">Mi Perfil</a>
            <button id="btn-logout" class="bg-red-50 text-red-600 px-3 py-1.5 rounded-lg hover:bg-red-100 transition">Salir</button>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto p-6 space-y-6">
        
        <!-- Dashboard YTD (Year to Date) Superior -->
        <div class="bg-gradient-to-r from-indigo-600 to-violet-600 text-white p-6 rounded-2xl shadow-md flex justify-between items-center">
            <div>
                <p class="text-indigo-200 text-sm font-medium">Resumen Anual (YTD 2026)</p>
                <h2 class="text-2xl font-bold" id="ytd-total-spent">$0.00 Gastados este año</h2>
            </div>
            <div class="text-right">
                <span class="bg-white/20 text-xs px-3 py-1 rounded-full uppercase tracking-wider font-semibold" id="ytd-status">Estabilidad Optimizada</span>
            </div>
        </div>

        <!-- Selector de Meses -->
        <div class="flex gap-2 overflow-x-auto pb-2" id="month-tabs">
            <!-- Se inyecta dinámicamente -->
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Columna Izquierda: Presupuesto y Tacómetro -->
            <div class="space-y-6">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                    <label class="block text-sm font-semibold text-gray-500 mb-2" id="budget-label">Presupuesto del Mes ($)</label>
                    <div class="flex gap-2">
                        <input type="number" id="budget-input" class="w-full p-2.5 border rounded-xl outline-none focus:border-indigo-600" placeholder="0.00">
                        <button id="save-budget" class="bg-indigo-600 text-white px-4 rounded-xl font-bold hover:bg-indigo-700 transition">Guardar</button>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 text-center">
                    <h3 class="font-bold text-gray-800 mb-4">Tacómetro Financiero</h3>
                    <div class="relative w-48 h-48 mx-auto">
                        <canvas id="gaugeChart"></canvas>
                        <div class="absolute inset-0 flex flex-col items-center justify-center pt-6">
                            <span class="text-2xl font-bold text-gray-800" id="spent-percentage">0%</span>
                            <span class="text-xs text-gray-400 uppercase">Gastado</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Columna Derecha: Registro y Tabla de Gastos -->
            <div class="lg:col-span-2 space-y-6">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                    <h3 class="font-bold text-gray-800 mb-4">Agregar Gasto Mensual</h3>
                    <form id="expense-form" class="grid grid-cols-1 sm:grid-cols-4 gap-3">
                        <input type="text" id="e-desc" placeholder="Descripción" class="p-2.5 border rounded-xl outline-none" required>
                        <input type="number" id="e-monto" placeholder="Monto" class="p-2.5 border rounded-xl outline-none" required>
                        <select id="e-tipo" class="p-2.5 border rounded-xl outline-none">
                            <option value="fijo">Fijo</option>
                            <option value="extra">Extraordinario</option>
                        </select>
                        <button type="submit" class="bg-emerald-600 text-white font-bold rounded-xl hover:bg-emerald-700 transition">Agregar</button>
                    </form>
                </div>

                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                    <h3 class="font-bold text-gray-800 mb-4" id="table-title">Registros del Mes</h3>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead>
                                <tr class="text-gray-400 text-sm border-b">
                                    <th class="pb-3">Descripción</th>
                                    <th class="pb-3">Tipo</th>
                                    <th class="pb-3">Monto</th>
                                    <th class="pb-3 text-right">Acción</th>
                                </tr>
                            </thead>
                            <tbody id="expense-list" class="divide-y divide-slate-100"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { doc, getDoc, setDoc, collection, addDoc, query, where, onSnapshot, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        let currentUid = null;
        const meses = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
        let currentMes = meses[new Date().getMonth()];
        const currentYear = new Date().getFullYear();
        let chartInstance = null;

        async function initDashboard() {
            await auth.authStateReady();
            const user = auth.currentUser;
            if (!user) {
                window.location.href = "index.html";
                return;
            }
            currentUid = user.uid;

            try {
                const userSnap = await getDoc(doc(db, "users", user.uid));
                if (userSnap.exists()) {
                    const data = userSnap.data();
                    document.getElementById('nav-name').textContent = data.name || "Usuario";
                    document.getElementById('nav-avatar').textContent = data.avatar || "👨‍💻";
                }
            } catch (err) {
                console.error("Error al cargar usuario:", err);
            }

            initMonthTabs();
            loadMonthData();
            loadYTDData();
        }

        initDashboard();

        document.getElementById('btn-logout').onclick = () => signOut(auth).then(() => window.location.href = "index.html");

        function initMonthTabs() {
            const container = document.getElementById('month-tabs');
            container.innerHTML = '';
            
            // Actualizar textos dinámicos según el mes seleccionado
            document.getElementById('budget-label').textContent = `Presupuesto de ${currentMes} ($)`;
            document.getElementById('table-title').textContent = `Registros de ${currentMes}`;

            meses.forEach(m => {
                const btn = document.createElement('button');
                btn.textContent = m;
                btn.className = `px-4 py-2 rounded-xl font-semibold whitespace-nowrap transition ${m === currentMes ? 'bg-indigo-600 text-white shadow-md' : 'bg-white text-gray-600 border hover:bg-slate-50'}`;
                btn.onclick = () => { 
                    currentMes = m; 
                    initMonthTabs(); 
                    loadMonthData(); 
                };
                container.appendChild(btn);
            });
        }

        document.getElementById('save-budget').onclick = async () => {
            const monto = parseFloat(document.getElementById('budget-input').value) || 0;
            await setDoc(doc(db, "presupuestos", `${currentUid}_${currentMes}`), { 
                monto, 
                mes: currentMes, 
                year: currentYear,
                userId: currentUid 
            });
            alert(`Presupuesto de ${currentMes} actualizado con éxito.`);
            loadMonthData();
        };

        async function loadMonthData() {
            // Actualizar textos dinámicos
            document.getElementById('budget-label').textContent = `Presupuesto de ${currentMes} ($)`;
            document.getElementById('table-title').textContent = `Registros de ${currentMes}`;

            const bDoc = await getDoc(doc(db, "presupuestos", `${currentUid}_${currentMes}`));
            const budget = bDoc.exists() ? bDoc.data().monto : 0;
            document.getElementById('budget-input').value = budget > 0 ? budget : '';

            const q = query(
                collection(db, "gastos"), 
                where("userId", "==", currentUid), 
                where("mes", "==", currentMes),
                where("year", "==", currentYear)
            );
            
            onSnapshot(q, (snapshot) => {
                const list = document.getElementById('expense-list');
                list.innerHTML = '';
                let totalSpent = 0;
                
                snapshot.forEach(d => {
                    const data = d.data();
                    totalSpent += data.monto;
                    list.innerHTML += `
                        <tr class="text-sm">
                            <td class="py-3 font-medium text-gray-800">${data.descripcion}</td>
                            <td class="py-3 text-gray-500 capitalize">${data.tipo}</td>
                            <td class="py-3 font-bold text-slate-700">$${data.monto.toFixed(2)}</td>
                            <td class="py-3 text-right"><button onclick="window.deleteExpense('${d.id}')" class="text-red-500 hover:underline">Eliminar</button></td>
                        </tr>`;
                });
                renderGauge(totalSpent, budget);
            });
        }

        window.deleteExpense = async (id) => { await deleteDoc(doc(db, "gastos", id)); };

        document.getElementById('expense-form').onsubmit = async (e) => {
            e.preventDefault();
            await addDoc(collection(db, "gastos"), {
                descripcion: document.getElementById('e-desc').value,
                monto: parseFloat(document.getElementById('e-monto').value),
                tipo: document.getElementById('e-tipo').value,
                mes: currentMes,
                year: currentYear,
                userId: currentUid,
                createdAt: new Date()
            });
            e.target.reset();
            loadMonthData();
        };

        function renderGauge(spent, budget) {
            const available = Math.max(0, budget - spent);
            const percentage = budget > 0 ? Math.round((spent / budget) * 100) : 0;
            document.getElementById('spent-percentage').textContent = percentage + '%';

            const ctx = document.getElementById('gaugeChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();
            chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: { datasets: [{ data: [spent, available], backgroundColor: ['#4f46e5', '#e2e8f0'], borderWidth: 0 }] },
                options: { rotation: -90, circumference: 180, cutout: '80%', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });
        }

        async function loadYTDData() {
            // Filtrar YTD estrictamente por el año actual (2026)
            const q = query(
                collection(db, "gastos"), 
                where("userId", "==", currentUid),
                where("year", "==", currentYear)
            );
            
            onSnapshot(q, (snap) => {
                let totalYTD = 0;
                snap.forEach(d => totalYTD += d.data().monto);
                document.getElementById('ytd-total-spent').textContent = `$${totalYTD.toFixed(2)} Gastados en el año`;
            });
        }
    </script>
</body>
</html>
