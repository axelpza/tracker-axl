<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Tracker Finanzas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="flex items-center justify-center min-h-screen p-4 relative overflow-x-hidden">

    <div class="theme-card p-6 sm:p-8 rounded-2xl shadow-xl w-full max-w-md border relative z-10 backdrop-blur-md">
        <h2 id="form-title" class="text-2xl font-bold mb-6 text-indigo-400">Iniciar Sesión</h2>
        
        <form id="login-form" class="space-y-4">
            <!-- Campos de Registro -->
            <div id="register-fields" class="space-y-4 hidden">
                <input type="text" id="reg-name" placeholder="Nombre completo" class="theme-input w-full p-3 border rounded-xl outline-none text-sm">
                <input type="text" id="reg-user" placeholder="Nombre de usuario" class="theme-input w-full p-3 border rounded-xl outline-none text-sm">
                <div>
                    <label class="block text-sm text-slate-300 mb-1">Elige tu Avatar:</label>
                    <div class="flex gap-3 justify-around text-xl">
                        <label class="cursor-pointer"><input type="radio" name="avatar" value="👨‍💻" checked> 👨‍💻</label>
                        <label class="cursor-pointer"><input type="radio" name="avatar" value="👩‍💼"> 👩‍💼</label>
                        <label class="cursor-pointer"><input type="radio" name="avatar" value="🚀"> 🚀</label>
                        <label class="cursor-pointer"><input type="radio" name="avatar" value="💰"> 💰</label>
                    </div>
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-1">Correo electrónico</label>
                <input type="email" id="email" placeholder="correo@ejemplo.com" class="theme-input w-full p-3 border rounded-xl outline-none text-sm" required>
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-1">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" class="theme-input w-full p-3 border rounded-xl outline-none text-sm" required>
            </div>
            
            <button type="submit" id="submit-btn" class="w-full bg-indigo-600 text-white p-3 rounded-xl font-bold hover:bg-indigo-700 transition">Ingresar</button>
            
            <div class="flex flex-col sm:flex-row justify-between text-sm gap-2 mt-3">
                <button type="button" id="toggle-mode" class="text-indigo-400 hover:underline font-medium text-left">¿No tienes cuenta? Regístrate</button>
                <button type="button" id="forgot-pass" class="text-slate-400 hover:underline text-left">¿Olvidaste tu contraseña?</button>
            </div>
        </form>
        <p id="msg" class="text-red-400 text-sm mt-4 text-center font-medium"></p>
    </div>

    <!-- Módulos de Scripts -->
    <script type="module" src="js/theme.js"></script>
    <script type="module" src="js/background.js"></script>
    <script type="module" src="js/index.js"></script>
</body>
</html>
