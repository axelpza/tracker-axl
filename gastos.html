<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gastos y Registros - Tracker Finanzas</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen pb-12">

    <!-- Menú de Navegación Compartido -->
    <nav class="bg-white shadow-sm px-4 sm:px-6 py-4 flex flex-col sm:flex-row justify-between items-center gap-3">
        <div class="flex items-center gap-3">
            <span id="nav-avatar" class="text-2xl">👨‍💻</span>
            <h1 class="font-bold text-lg text-indigo-600">Hola, <span id="nav-name">Usuario</span></h1>
        </div>
        <div class="flex flex-wrap justify-center gap-3 sm:gap-4 items-center text-sm font-semibold">
            <a href="dashboard.html" class="text-gray-600 hover:text-indigo-600">Budget</a>
            <a href="gastos.html" class="text-indigo-600 border-b-2 border-indigo-600 pb-1">Gastos</a>
            <a href="adicionales.html" class="text-gray-600 hover:text-indigo-600">Gastos Adicionales</a>
            <a href="perfil.html" class="text-gray-600 hover:text-indigo-600">Mi Perfil</a>
            <button id="btn-logout" class="bg-red-50 text-red-600 px-3 py-1.5 rounded-lg hover:bg-red-100 transition">Salir</button>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto p-4 sm:p-6 space-y-6">
        
        <!-- Header y Resumen Rápido del Mes -->
        <div class="bg-white p-5 sm:p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
                <h2 class="text-xl font-bold text-gray-800">Registros y Control de Gastos</h2>
                <p class="text-xs text-gray-500">Visualiza, filtra y administra tus gastos por quincenas.</p>
            </div>
            <div class="bg-indigo-50 px-4 py-2 rounded-xl border border-indigo-100 flex gap-4 text-xs font-bold text-indigo-900">
                <div>Total Gastado: <span id="g-total-spent" class="text-indigo-600 text-sm font-extrabold block">$0.00</span></div>
            </div>
        </div>

        <!-- Selector de Meses -->
        <div class="flex gap-2 overflow-x-auto pb-2" id="month-tabs"></div>

        <!-- CONTROLES DE VISTA DE QUINCENA -->
        <div class="flex flex-wrap justify-between items-center bg-white p-4 rounded-2xl border border-slate-200 gap-2">
            <span class="text-xs font-bold text-gray-500 uppercase tracking-wider">Filtrar Quincena:</span>
            <div class="flex gap-2 overflow-x-auto">
                <button id="btn-view-q1" class="px-4 py-2 rounded-xl text-xs font-bold transition bg-indigo-600 text-white shadow-sm">1ra Quincena</button>
                <button id="btn-view-q2" class="px-4 py-2 rounded-xl text-xs font-bold transition bg-slate-100 text-gray-600 hover:bg-slate-200">2da Quincena</button>
                <button id="btn-view-mes" class="px-4 py-2 rounded-xl text-xs font-bold transition bg-slate-100 text-gray-600 hover:bg-slate-200">Mes Completo</button>
            </div>
        </div>

        <!-- TABLAS DE REGISTROS DE GASTOS -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <!-- CONTENEDOR 1RA QUINCENA -->
            <div id="wrapper-q1" class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                <div class="flex justify-between items-center pb-3 border-b">
                    <h3 class="font-bold text-blue-700 text-base flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full bg-blue-500 inline-block"></span> 1ra Quincena (1 - 15)
                    </h3>
                    <span class="text-xs font-bold text-slate-800 bg-blue-50 px-3 py-1 rounded-lg border border-blue-100" id="q1-expense-total">$0.00</span>
                </div>
                <div id="expense-cards-q1" class="space-y-2.5"></div>
            </div>

            <!-- CONTENEDOR 2DA QUINCENA -->
            <div id="wrapper-q2" class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-4 hidden">
                <div class="flex justify-between items-center pb-3 border-b">
                    <h3 class="font-bold text-purple-700 text-base flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full bg-purple-500 inline-block"></span> 2da Quincena (16 - 31)
                    </h3>
                    <span class="text-xs font-bold text-slate-800 bg-purple-50 px-3 py-1 rounded-lg border border-purple-100" id="q2-expense-total">$0.00</span>
                </div>
                <div id="expense-cards-q2" class="space-y-2.5"></div>
            </div>

        </div>
    </main>

    <!-- MODAL POPUP PARA EDITAR Y ELIMINAR GASTO -->
    <div id="edit-expense-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white w-full max-w-md rounded-2xl p-6 shadow-xl space-y-4 relative">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="font-bold text-gray-800 text-base">Editar Registro de Gasto</h3>
                <button id="btn-close-modal" class="text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
            </div>

            <form id="edit-expense-form" class="space-y-3 text-xs">
                <input type="hidden" id="modal-expense-id">
                
                <div>
                    <label class="block font-semibold text-gray-600 mb-1">Descripción</label>
                    <input type="text" id="m-desc" class="w-full p-2.5 border rounded-xl outline-none text-sm focus:border-indigo-600" required>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block font-semibold text-gray-600 mb-1">Monto ($)</label>
                        <input type="number" step="0.01" id="m-monto" class="w-full p-2.5 border rounded-xl outline-none text-sm focus:border-indigo-600" required>
                    </div>
                    <div>
                        <label class="block font-semibold text-gray-600 mb-1">Quincena</label>
                        <select id="m-quincena" class="w-full p-2.5 border rounded-xl outline-none text-sm bg-white focus:border-indigo-600">
                            <option value="1ra Quincena">1ra Quincena (1-15)</option>
                            <option value="2da Quincena">2da Quincena (16-31)</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block font-semibold text-gray-600 mb-1">Tipo</label>
                        <select id="m-tipo" class="w-full p-2.5 border rounded-xl outline-none text-sm bg-white focus:border-indigo-600">
                            <option value="fijo">Fijo</option>
                            <option value="extra">Extraordinario</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-semibold text-gray-600 mb-1">Categoría</label>
                        <select id="m-categoria" class="w-full p-2.5 border rounded-xl outline-none text-sm bg-white focus:border-indigo-600">
                            <option value="Restaurante">Restaurante</option>
                            <option value="Supermercado">Supermercado</option>
                            <option value="Vivienda">Vivienda</option>
                            <option value="Automóvil">Automóvil</option>
                            <option value="Banco">Banco</option>
                            <option value="Préstamos">Préstamos</option>
                            <option value="Combustible">Combustible</option>
                            <option value="Escuela/Universidad">Escuela/Universidad</option>
                            <option value="Servicios Públicos">Servicios Públicos</option>
                            <option value="Chucherías/Compras">Chucherías/Compras</option>
                            <option value="Ropa">Ropa</option>
                            <option value="Gastos Médicos">Gastos Médicos</option>
                            <option value="Otros">Otros</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block font-semibold text-gray-600 mb-1">Prioridad</label>
                    <select id="m-prioridad" class="w-full p-2.5 border rounded-xl outline-none text-sm bg-white focus:border-indigo-600">
                        <option value="Alta">Alta</option>
                        <option value="Media">Media</option>
                        <option value="Baja">Baja</option>
                    </select>
                </div>

                <div class="pt-3 flex gap-2">
                    <button type="submit" class="flex-1 bg-indigo-600 text-white font-bold py-2.5 rounded-xl hover:bg-indigo-700 transition">
                        Guardar Cambios
                    </button>
                    <button type="button" id="btn-delete-modal" class="bg-red-50 text-red-600 font-bold px-4 py-2.5 rounded-xl hover:bg-red-100 transition">
                        Eliminar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { doc, getDoc, updateDoc, collection, query, where, onSnapshot, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        let currentUid = null;
        const meses = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
        let currentMes = meses[new Date().getMonth()];
        const currentYear = new Date().getFullYear();

        async function initGastosPage() {
            await auth.authStateReady();
            const user = auth.currentUser;
            if (!user) { window.location.href = "index.html"; return; }
            currentUid = user.uid;

            try {
                const userSnap = await getDoc(doc(db, "users", user.uid));
                if (userSnap.exists()) {
                    const data = userSnap.data();
                    document.getElementById('nav-name').textContent = data.name || "Usuario";
                    document.getElementById('nav-avatar').textContent = data.avatar || "👨‍💻";
                }
            } catch (err) {
                console.error("Error al cargar usuario:", err);
            }

            initMonthTabs();
            loadGastosData();
        }

        initGastosPage();

        document.getElementById('btn-logout').onclick = () => signOut(auth).then(() => window.location.href = "index.html");

        function initMonthTabs() {
            const container = document.getElementById('month-tabs');
            container.innerHTML = '';

            meses.forEach(m => {
                const btn = document.createElement('button');
                btn.textContent = m;
                btn.className = `px-4 py-2 rounded-xl font-semibold whitespace-nowrap transition ${m === currentMes ? 'bg-indigo-600 text-white shadow-md' : 'bg-white text-gray-600 border hover:bg-slate-50'}`;
                btn.onclick = () => { 
                    currentMes = m; 
                    initMonthTabs(); 
                    loadGastosData(); 
                };
                container.appendChild(btn);
            });
        }

        // Control de vistas por botones (1ra Quincena, 2da Quincena, Mes Completo)
        const btnQ1 = document.getElementById('btn-view-q1');
        const btnQ2 = document.getElementById('btn-view-q2');
        const btnMes = document.getElementById('btn-view-mes');
        const wrapQ1 = document.getElementById('wrapper-q1');
        const wrapQ2 = document.getElementById('wrapper-q2');

        function setQuincenaView(viewMode) {
            btnQ1.className = `px-4 py-2 rounded-xl text-xs font-bold transition ${viewMode === 'q1' ? 'bg-indigo-600 text-white shadow-sm' : 'bg-slate-100 text-gray-600 hover:bg-slate-200'}`;
            btnQ2.className = `px-4 py-2 rounded-xl text-xs font-bold transition ${viewMode === 'q2' ? 'bg-indigo-600 text-white shadow-sm' : 'bg-slate-100 text-gray-600 hover:bg-slate-200'}`;
            btnMes.className = `px-4 py-2 rounded-xl text-xs font-bold transition ${viewMode === 'mes' ? 'bg-indigo-600 text-white shadow-sm' : 'bg-slate-100 text-gray-600 hover:bg-slate-200'}`;

            if (viewMode === 'q1') {
                wrapQ1.classList.remove('hidden');
                wrapQ2.classList.add('hidden');
            } else if (viewMode === 'q2') {
                wrapQ1.classList.add('hidden');
                wrapQ2.classList.remove('hidden');
            } else {
                wrapQ1.classList.remove('hidden');
                wrapQ2.classList.remove('hidden');
            }
        }

        btnQ1.onclick = () => setQuincenaView('q1');
        btnQ2.onclick = () => setQuincenaView('q2');
        btnMes.onclick = () => setQuincenaView('mes');

        function loadGastosData() {
            const q = query(
                collection(db, "gastos"), 
                where("userId", "==", currentUid), 
                where("mes", "==", currentMes),
                where("year", "==", currentYear)
            );

            onSnapshot(q, (snapshot) => {
                const listQ1 = document.getElementById('expense-cards-q1');
                const listQ2 = document.getElementById('expense-cards-q2');
                listQ1.innerHTML = '';
                listQ2.innerHTML = '';

                let totalSpent = 0;
                let spentQ1 = 0;
                let spentQ2 = 0;

                snapshot.forEach(d => {
                    const data = d.data();
                    const itemData = { id: d.id, ...data };
                    totalSpent += data.monto;

                    const prioColor = data.prioridad === 'Alta' ? 'bg-red-100 text-red-700' : (data.prioridad === 'Baja' ? 'bg-slate-100 text-slate-600' : 'bg-amber-100 text-amber-800');

                    const cardHtml = `
                        <div class="bg-slate-50 border border-slate-200 rounded-xl p-3.5 flex justify-between items-center text-xs hover:border-indigo-200 transition shadow-sm">
                            <div class="space-y-1">
                                <div class="flex items-center gap-2">
                                    <span class="font-bold text-gray-800 text-sm">${data.descripcion}</span>
                                    <span class="px-2 py-0.5 rounded-md text-[10px] font-bold ${prioColor}">${data.prioridad || 'Media'}</span>
                                </div>
                                <div class="flex items-center gap-2 text-[11px] text-gray-500">
                                    <span class="font-semibold text-indigo-600">${data.categoria || 'Otros'}</span>
                                    <span>•</span>
                                    <span class="capitalize">${data.tipo}</span>
                                </div>
                            </div>
                            <div class="flex items-center gap-3">
                                <span class="font-bold text-slate-800 text-sm">$${data.monto.toFixed(2)}</span>
                                <button onclick='window.openEditModal(${JSON.stringify(itemData)})' class="p-2 rounded-lg bg-white border border-slate-200 hover:bg-slate-100 text-indigo-600 transition" title="Editar Gasto">
                                    ✏️
                                </button>
                            </div>
                        </div>`;

                    if (data.quincena === '2da Quincena') {
                        spentQ2 += data.monto;
                        listQ2.innerHTML += cardHtml;
                    } else {
                        spentQ1 += data.monto;
                        listQ1.innerHTML += cardHtml;
                    }
                });

                if (listQ1.innerHTML === '') listQ1.innerHTML = `<p class="py-6 text-center text-gray-400 text-xs">Sin registros en 1ra Quincena</p>`;
                if (listQ2.innerHTML === '') listQ2.innerHTML = `<p class="py-6 text-center text-gray-400 text-xs">Sin registros en 2da Quincena</p>`;

                document.getElementById('q1-expense-total').textContent = `$${spentQ1.toFixed(2)}`;
                document.getElementById('q2-expense-total').textContent = `$${spentQ2.toFixed(2)}`;
                document.getElementById('g-total-spent').textContent = `$${totalSpent.toFixed(2)}`;
            });
        }

        // LÓGICA DEL MODAL POPUP DE EDICIÓN
        const modal = document.getElementById('edit-expense-modal');
        const btnCloseModal = document.getElementById('btn-close-modal');

        window.openEditModal = (item) => {
            document.getElementById('modal-expense-id').value = item.id;
            document.getElementById('m-desc').value = item.descripcion || '';
            document.getElementById('m-monto').value = item.monto || '';
            document.getElementById('m-quincena').value = item.quincena || '1ra Quincena';
            document.getElementById('m-tipo').value = item.tipo || 'fijo';
            document.getElementById('m-categoria').value = item.categoria || 'Otros';
            document.getElementById('m-prioridad').value = item.prioridad || 'Media';
            modal.classList.remove('hidden');
        };

        btnCloseModal.onclick = () => modal.classList.add('hidden');

        document.getElementById('edit-expense-form').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('modal-expense-id').value;
            
            await updateDoc(doc(db, "gastos", id), {
                descripcion: document.getElementById('m-desc').value,
                monto: parseFloat(document.getElementById('m-monto').value),
                quincena: document.getElementById('m-quincena').value,
                tipo: document.getElementById('m-tipo').value,
                categoria: document.getElementById('m-categoria').value,
                prioridad: document.getElementById('m-prioridad').value
            });

            modal.classList.add('hidden');
            loadGastosData();
        };

        document.getElementById('btn-delete-modal').onclick = async () => {
            const id = document.getElementById('modal-expense-id').value;
            if (confirm("¿Estás seguro de que deseas eliminar este gasto?")) {
                await deleteDoc(doc(db, "gastos", id));
                modal.classList.add('hidden');
                loadGastosData();
            }
        };
    </script>
</body>
</html>
