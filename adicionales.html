<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gastos Adicionales - Tracker Finanzas</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen">

    <!-- Menú de Navegación Compartido -->
    <nav class="bg-white shadow-sm px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <span id="nav-avatar" class="text-2xl">👨‍💻</span>
            <h1 class="font-bold text-lg text-indigo-600">Hola, <span id="nav-name">Usuario</span></h1>
        </div>
        <div class="flex gap-4 items-center text-sm font-semibold">
            <a href="dashboard.html" class="text-gray-600 hover:text-indigo-600">Budget</a>
            <a href="adicionales.html" class="text-indigo-600 border-b-2 border-indigo-600 pb-1">Gastos Adicionales</a>
            <a href="perfil.html" class="text-gray-600 hover:text-indigo-600">Mi Perfil</a>
            <button id="btn-logout" class="bg-red-50 text-red-600 px-3 py-1.5 rounded-lg hover:bg-red-100 transition">Salir</button>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto p-6 space-y-6">
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <h2 class="text-xl font-bold text-gray-800 mb-2">Mapa de Deseos y Compras Opcionales</h2>
            <p class="text-sm text-gray-500 mb-6">Agrega artículos o proyectos deseados. El algoritmo evaluará si tu presupuesto actual permite asumirlos.</p>
            
            <form id="item-form" class="grid grid-cols-1 sm:grid-cols-5 gap-3">
                <input type="text" id="i-articulo" placeholder="Artículo / Servicio" class="p-2.5 border rounded-xl outline-none" required>
                <input type="number" id="i-monto" placeholder="Monto ($)" class="p-2.5 border rounded-xl outline-none" required>
                <input type="url" id="i-url" placeholder="URL Opcional" class="p-2.5 border rounded-xl outline-none">
                <select id="i-prioridad" class="p-2.5 border rounded-xl outline-none">
                    <option value="Alta">Prioridad Alta</option>
                    <option value="Media" selected>Prioridad Media</option>
                    <option value="Baja">Prioridad Baja</option>
                </select>
                <button type="submit" class="bg-indigo-600 text-white font-bold rounded-xl hover:bg-indigo-700 transition">Evaluar y Guardar</button>
            </form>
        </div>

        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <h3 class="font-bold text-gray-800 mb-4">Listado y Viabilidad</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead>
                        <tr class="text-gray-400 text-sm border-b">
                            <th class="pb-3">Artículo / Servicio</th>
                            <th class="pb-3">Monto</th>
                            <th class="pb-3">Prioridad</th>
                            <th class="pb-3">Estado / Sugerencia</th>
                            <th class="pb-3 text-right">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="items-list" class="divide-y divide-slate-100"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { doc, getDoc, collection, addDoc, query, where, onSnapshot, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        let currentUid = null;
        const currentMes = new Date().toLocaleString('es-ES', { month: 'long' });

        async function initAdicionales() {
            // Asegurar que la sesión esté lista antes de cargar datos
            await auth.authStateReady();
            const user = auth.currentUser;
            if (!user) { window.location.href = "index.html"; return; }
            currentUid = user.uid;
            
            try {
                const userSnap = await getDoc(doc(db, "users", user.uid));
                if (userSnap.exists()) {
                    document.getElementById('nav-name').textContent = userSnap.data().name || "Usuario";
                    document.getElementById('nav-avatar').textContent = userSnap.data().avatar || "👨‍💻";
                }
            } catch (err) {
                console.error("Error al cargar usuario:", err);
            }

            loadAdicionales();
        }

        initAdicionales();

        document.getElementById('btn-logout').onclick = () => signOut(auth).then(() => window.location.href = "index.html");

        document.getElementById('item-form').onsubmit = async (e) => {
            e.preventDefault();
            await addDoc(collection(db, "gastos_adicionales"), {
                articulo: document.getElementById('i-articulo').value,
                monto: parseFloat(document.getElementById('i-monto').value),
                url: document.getElementById('i-url').value,
                prioridad: document.getElementById('i-prioridad').value,
                estado: "Pendiente",
                userId: currentUid,
                createdAt: new Date()
            });
            e.target.reset();
        };

        async function loadAdicionales() {
            try {
                const bDoc = await getDoc(doc(db, "presupuestos", `${currentUid}_${currentMes}`));
                const budget = bDoc.exists() ? bDoc.data().monto : 0;

                const qAdicionales = query(collection(db, "gastos_adicionales"), where("userId", "==", currentUid));
                
                onSnapshot(qAdicionales, (snapshot) => {
                    const list = document.getElementById('items-list');
                    list.innerHTML = '';
                    
                    let gastadoMes = 0;
                    const disponible = Math.max(0, budget - gastadoMes);

                    snapshot.forEach(d => {
                        const data = d.data();
                        const esViable = data.monto <= (disponible > 0 ? disponible : 500); 
                        const badgeColor = esViable ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700';
                        const textoSugerencia = esViable ? 'Viable este mes' : 'Recomendado posponer';

                        list.innerHTML += `
                            <tr class="text-sm">
                                <td class="py-3 font-medium text-gray-800">
                                    ${data.articulo} 
                                    ${data.url ? `<a href="${data.url}" target="_blank" class="text-indigo-600 text-xs ml-1 hover:underline">[Enlace]</a>` : ''}
                                </td>
                                <td class="py-3 font-bold text-slate-700">$${data.monto.toFixed(2)}</td>
                                <td class="py-3 text-gray-500">${data.prioridad}</td>
                                <td class="py-3"><span class="px-2.5 py-1 rounded-full text-xs font-bold ${badgeColor}">${textoSugerencia}</span></td>
                                <td class="py-3 text-right"><button onclick="window.deleteItem('${d.id}')" class="text-red-500 hover:underline">Eliminar</button></td>
                            </tr>`;
                    });
                });
            } catch (err) {
                console.error("Error cargando gastos adicionales:", err);
            }
        }

        window.deleteItem = async (id) => { await deleteDoc(doc(db, "gastos_adicionales", id)); };
    </script>
</body>
</html>
